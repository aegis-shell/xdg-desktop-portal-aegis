# Local-only source patches for cross-repository Aegis development.
#
# Enable this file only in a linked portal checkout:
#   cp .cargo/aegis-local.toml .cargo/config.toml
#   git config core.hooksPath .githooks
#
# The generated .cargo/config.toml is ignored by Git. Adjust the paths when
# the adjacent Aegis checkout is not named "aegis".
[patch."https://github.com/ming2k/aegis"]
aegis-core = { path = "../aegis/crates/aegis-core" }
aegis-ipc = { path = "../aegis/crates/aegis-ipc" }
aegis-logging = { path = "../aegis/crates/aegis-logging" }
