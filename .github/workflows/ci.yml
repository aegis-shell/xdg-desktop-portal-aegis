name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the locked Optics release
        id: optics-release
        run: echo "ref=$(scripts/optics-release-ref.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ming2k/optics
          path: optics
          ref: ${{ steps.optics-release.outputs.ref }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libclang-dev libpam0g-dev \
            libpipewire-0.3-dev libspa-0.2-dev pkg-config \
            meson ninja-build glslang-tools \
            libwayland-dev wayland-protocols libvulkan-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev \
            libfribidi-dev libxkbcommon-dev
      - name: Build and install optics C libraries
        run: |
          meson setup optics/build optics \
            -Dexamples=false -Dtests=false --buildtype=release
          meson compile -C optics/build
          sudo meson install -C optics/build
          sudo ldconfig
          pkg-config --modversion flux lens iris
      - name: Check minimum supported Rust
        run: cargo check --locked --workspace --all-targets
      - name: Lint with minimum supported Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the locked Optics release
        id: optics-release
        run: echo "ref=$(scripts/optics-release-ref.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ming2k/optics
          path: optics
          ref: ${{ steps.optics-release.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dbus-daemon libclang-dev libpam0g-dev \
            libpipewire-0.3-dev libspa-0.2-dev pkg-config \
            meson ninja-build glslang-tools \
            libwayland-dev wayland-protocols libvulkan-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev \
            libfribidi-dev libxkbcommon-dev \
            mesa-vulkan-drivers pipewire wireplumber \
            gstreamer1.0-pipewire gstreamer1.0-tools \
            xdg-desktop-portal xdg-utils
      - name: Build and install optics C libraries
        run: |
          meson setup optics/build optics \
            -Dexamples=false -Dtests=false --buildtype=release
          meson compile -C optics/build
          sudo meson install -C optics/build
          sudo ldconfig
          pkg-config --modversion flux lens iris
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        env:
          AEGIS_PORTAL_REQUIRE_E2E: "1"
          AEGIS_PORTAL_REQUIRE_PIPEWIRE_E2E: "1"
        run: cargo test --locked --workspace
      - name: Documentation
        run: cargo doc --locked --workspace --no-deps
      - name: Release build
        run: cargo build --locked --release --workspace
      - name: Package staging
        run: |
          meson setup build-package --buildtype=release --prefix=/usr -Dpam=false
          meson compile -C build-package
          DESTDIR="$PWD/stage" meson install -C build-package
          test -x stage/usr/libexec/xdg-desktop-portal-aegis
          test -x stage/usr/libexec/aegis-portal-prompter
          grep -Fx 'Exec=/usr/libexec/xdg-desktop-portal-aegis' \
            stage/usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.aegis.service
          test -z "$(find stage -path '*/security/pam_aegis.so' -print -quit)"

          meson setup build-package --reconfigure -Dpam=true
          meson compile -C build-package
          DESTDIR="$PWD/stage-pam" meson install -C build-package
          find stage-pam -path '*/security/pam_aegis.so' \
            -type f -perm /111 -print -quit | grep -q .
