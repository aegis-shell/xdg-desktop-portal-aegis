[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/aegis-shell/xdg-desktop-portal-aegis"

[workspace.dependencies]
# The portal is released against one exact Aegis IPC revision. Local joint
# development uses .cargo/aegis-local.toml without changing this source of
# truth or the canonical lockfile.
aegis-authority = { version = "=0.0.11", git = "https://github.com/ming2k/aegis", tag = "v0.0.11" }
aegis-core = { version = "=0.0.11", git = "https://github.com/ming2k/aegis", tag = "v0.0.11" }
aegis-ipc = { version = "=0.0.11", git = "https://github.com/ming2k/aegis", tag = "v0.0.11" }
aegis-logging = { version = "=0.0.11", git = "https://github.com/ming2k/aegis", tag = "v0.0.11" }

aegis-portal-runtime = { version = "=0.0.2", path = "crates/aegis-portal-runtime" }
aegis-portal-prompter = { version = "=0.0.2", path = "crates/aegis-portal-prompter" }
aegis-portal-secret = { version = "=0.0.2", path = "crates/aegis-portal-secret" }

dirs = "5"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1.8"
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
