[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/aegis-shell/xdg-desktop-portal-aegis"

[workspace.dependencies]
aegis-portal-ipc = { version = "=0.0.4", path = "crates/aegis-portal-ipc" }
aegis-portal-runtime = { version = "=0.0.4", path = "crates/aegis-portal-runtime" }
aegis-portal-prompter = { version = "=0.0.4", path = "crates/aegis-portal-prompter" }
aegis-portal-secret = { version = "=0.0.4", path = "crates/aegis-portal-secret" }

dirs = "5"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1.8"
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
