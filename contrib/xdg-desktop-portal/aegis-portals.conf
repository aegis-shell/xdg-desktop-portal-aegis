[preferred]
# Aegis is the full-stack default backend. GTK remains the safety net for
# interfaces Aegis does not implement (Access, Print,
# Location, Background, …): the frontend only asks Aegis for the interfaces
# advertised in aegis.portal and falls to GTK for the rest.
default=aegis;gtk
org.freedesktop.impl.portal.Settings=aegis;gtk
org.freedesktop.impl.portal.Screenshot=aegis;gtk
org.freedesktop.impl.portal.ScreenCast=aegis
# Aegis only has compositor-local idle inhibition. GTK owns the full
# logout/user-switch/suspend/idle and session-monitor contract.
org.freedesktop.impl.portal.Inhibit=gtk
# Secret retrieval is served entirely by Aegis (at-rest vault, no frontend
# UI involved), so no fallback is needed.
org.freedesktop.impl.portal.Secret=aegis
# Lockdown is a stateless all-permissive policy query; no fallback needed.
org.freedesktop.impl.portal.Lockdown=aegis
# FileChooser is owned by this backend and rendered in its supervised,
# one-shot GTK4 prompter. Aegis only supplies xdg-foreign window parenting.
# GTK remains an independent fallback backend for installation failures.
org.freedesktop.impl.portal.FileChooser=aegis;gtk
# Email hands the message to the session mail client via xdg-email (no UI of
# its own). GTK keeps a compose-dialog fallback.
org.freedesktop.impl.portal.Email=aegis;gtk
# AppChooser requires live UpdateChoices and activation-token generation;
# route the whole interface to GTK until the compositor IPC supports both.
org.freedesktop.impl.portal.AppChooser=gtk
# The compositor queue cannot yet represent icons, priorities, or actions.
org.freedesktop.impl.portal.Notification=gtk
# Account answers only after the compositor's consent dialog; GTK keeps a
# fallback while the consent flow proves itself.
org.freedesktop.impl.portal.Account=aegis;gtk
# GTK supplies editable launcher metadata and the complete wallpaper option
# semantics; the Aegis IPC versions intentionally remain unadvertised.
org.freedesktop.impl.portal.DynamicLauncher=gtk
org.freedesktop.impl.portal.Wallpaper=gtk
