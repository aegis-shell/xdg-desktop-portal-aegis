[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]
exceptions = [
    { allow = ["GPL-3.0"], crate = "pamsm" },
    { allow = ["GPL-3.0-only"], crate = "aegis-pam" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
# Every inherited dependency is pinned by the workspace table. cargo-deny
# 0.19 diagnoses `workspace = true` as a wildcard even when that entry has an
# exact version or path, so the source-of-truth entries are audited
# instead of rejecting their inherited uses.
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The optics Rust bindings (iris/lens and their -sys crates) come from the
# tagged monorepo release.
allow-git = ["https://github.com/ming2k/optics"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
